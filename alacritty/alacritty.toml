[general]
live_config_reload = true
import = [
    "catppuccin-mocha.toml",
]

[env]
TERM = "xterm-256color"
COLORTERM = "truecolor"

[font]
size = 12.0

[font.normal]
family = "JetBrainsMono Nerd Font Mono"
style = "Regular"

[font.bold]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold"

[font.italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Italic"

[font.bold_italic]
family = "JetBrainsMono Nerd Font Mono"
style = "Bold Italic"

[window]
startup_mode = "Fullscreen"
dynamic_title = true

[cursor]
style = { shape = "Block", blinking = "Off" }

[scrolling]
history = 10000

[mouse]
hide_when_typing = true
